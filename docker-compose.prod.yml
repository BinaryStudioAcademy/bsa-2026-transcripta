# Production stack for the EC2 host.
#
#   BACKEND_IMAGE=<ecr_repo_url>:latest docker compose -f docker-compose.prod.yml up -d
#
# The backend image comes from ECR (or a local build for testing). Files go to
# real S3 — there is no MinIO here (that is local-only). Provide production
# values in apps/backend/.env.prod (DB_CONNECTION_STRING must point at the
# `postgres` service host, not localhost).

services:
  backend:
    image: ${BACKEND_IMAGE:-transcripta-backend:local}
    restart: unless-stopped
    env_file: apps/backend/.env.prod
    ports:
      - "${HTTP_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: transcripta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcripta}
      POSTGRES_DB: transcripta
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcripta"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "2gb",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
