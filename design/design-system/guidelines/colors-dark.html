<!-- @dsCard group="Colors" viewport="700x180" name="Dark Theme" subtitle="Reading room at night — warm near-black, amber-tinted accents" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--bg);font-family:var(--font-ui)}.row{display:flex;gap:6px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.sw i{display:block;height:42px;border-radius:3px;border:1px solid var(--hairline)}.sw b{font:500 9.5px/1.2 var(--font-mono);color:var(--text)}.sw s{text-decoration:none;font:400 9px/1.25 var(--font-ui);color:var(--text-3);overflow:hidden;display:block}</style></head><body data-theme="dark"><div class="row" style="margin-bottom:8px"><div class="sw"><i style="background:var(--bg)"></i><b>bg</b><s>night ground</s></div><div class="sw"><i style="background:var(--surface)"></i><b>surface</b><s>raised surface</s></div><div class="sw"><i style="background:var(--surface-2)"></i><b>surface-2</b><s>hover, headers</s></div><div class="sw"><i style="background:var(--hairline)"></i><b>hairline</b><s>rules · lighter than surfaces</s></div><div class="sw"><i style="background:var(--text)"></i><b>text</b><s>warm off-white</s></div><div class="sw"><i style="background:var(--text-2)"></i><b>text-2</b><s>secondary</s></div></div>
<div class="row"><div class="sw"><i style="background:var(--accent)"></i><b>accent</b><s>amber-tinted seal</s></div><div class="sw"><i style="background:var(--link)"></i><b>link</b><s>links</s></div><div class="sw"><i style="background:var(--ok)"></i><b>ok</b><s>confirmed</s></div><div class="sw"><i style="background:var(--warn)"></i><b>warn</b><s>budget</s></div><div class="sw"><i style="background:var(--danger)"></i><b>danger</b><s>failure</s></div><div class="sw"><i style="background:var(--mark-bg)"></i><b>mark-bg</b><s>lexicon mark</s></div></div></body></html>
