<!-- @dsCard group="Spacing" viewport="700x150" name="Radii & Hairlines" subtitle="Crisp small radii — print, not pill; elevation = ivory over paper plus hairlines" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--bg);font-family:var(--font-ui)}.row{display:flex;gap:6px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.sw i{display:block;height:42px;border-radius:3px;border:1px solid var(--hairline)}.sw b{font:500 9.5px/1.2 var(--font-mono);color:var(--text)}.sw s{text-decoration:none;font:400 9px/1.25 var(--font-ui);color:var(--text-3);overflow:hidden;display:block}</style></head><body><div style="display:flex;gap:16px;align-items:center">
<div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:64px;height:44px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-xs)"></div><span style="font:400 9.5px var(--font-mono);color:var(--text-3)">2px · checks</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:64px;height:44px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-sm)"></div><span style="font:400 9.5px var(--font-mono);color:var(--text-3)">3px · chips, kbd</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:64px;height:44px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-md)"></div><span style="font:400 9.5px var(--font-mono);color:var(--text-3)">4px · buttons, inputs</span></div><div style="display:flex;flex-direction:column;gap:5px;align-items:center"><div style="width:64px;height:44px;background:var(--surface);border:1px solid var(--hairline-strong);border-radius:var(--r-lg)"></div><span style="font:400 9.5px var(--font-mono);color:var(--text-3)">6px · cards, dialogs — max</span></div>
<div style="flex:1;margin-left:8px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:10px 12px"><div style="font:600 12px var(--font-ui);color:var(--text)">Raised = ivory + hairline</div><div style="border-top:1px solid var(--hairline);margin-top:8px;padding-top:8px;font:400 11px var(--font-ui);color:var(--text-3)">Shadows are quiet, warm, overlays only</div></div>
</div></body></html>
