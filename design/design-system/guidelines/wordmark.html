<!-- @dsCard group="Brand" viewport="700x190" name="Wordmark & Lockup" subtitle="The Nib mark — broad-nib T in ink with one seal-red drop; bolder redraw below 20px" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--bg);font-family:var(--font-ui)}.lbl{font:500 9px/1 var(--font-mono);letter-spacing:.06em;color:var(--text-3)}</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="nib" viewBox="0 0 48 48"><path d="M9 13 L39 9.5 L37.4 15.2 L10.6 17.4 Z" fill="var(--mink)"></path><path d="M20.8 14.6 L27.6 13.9 L25.2 41.5 L23.4 41.5 Z" fill="var(--mink)"></path><circle cx="30.5" cy="39.5" r="2.2" fill="var(--mseal)"></circle></symbol>
<symbol id="nib-sm" viewBox="0 0 48 48"><path d="M7 12 L41 8.5 L39.5 17 L8.5 19.5 Z" fill="var(--mink)"></path><path d="M19.5 15.5 L29 14.5 L26 42 L22.5 42 Z" fill="var(--mink)"></path><circle cx="33.5" cy="38.5" r="3.4" fill="var(--mseal)"></circle></symbol>
</svg>
<div style="display:flex;gap:22px;align-items:center;margin-bottom:14px">
<span style="--mink:var(--text);--mseal:var(--seal-500)"><svg width="72" height="72"><use href="#nib"></use></svg></span>
<span style="width:1px;height:56px;background:var(--hairline-strong)"></span>
<span style="display:inline-flex;gap:9px;align-items:center"><span style="width:26px;height:26px;border-radius:5px;background:var(--seal-500);display:inline-grid;place-items:center;--mink:var(--paper-100);--mseal:var(--paper-100)"><svg width="18" height="18"><use href="#nib-sm"></use></svg></span><span style="font:600 16px var(--font-display);color:var(--text)">Transcripta</span></span>
<span style="width:1px;height:56px;background:var(--hairline-strong)"></span>
<span style="display:inline-flex;gap:7px;align-items:center"><span style="width:20px;height:20px;border-radius:4px;background:var(--seal-500);display:inline-grid;place-items:center;--mink:var(--paper-100);--mseal:var(--paper-100)"><svg width="14" height="14"><use href="#nib-sm"></use></svg></span><span style="font:600 13px var(--font-display);color:var(--text)">Transcripta</span></span>
</div>
<div style="display:flex;gap:22px;align-items:center">
<span style="display:inline-flex;gap:8px;align-items:center">
<span class="lbl">FAVICON 16+32</span>
<span style="width:26px;height:26px;display:inline-grid;place-items:center;background:var(--paper-900);border-radius:2px;--mink:#F3EDE1;--mseal:var(--seal-400)"><svg width="16" height="16"><use href="#nib-sm"></use></svg></span>
<span style="width:26px;height:26px;display:inline-grid;place-items:center;background:var(--seal-500);border-radius:2px;--mink:var(--paper-100);--mseal:var(--paper-100)"><svg width="16" height="16"><use href="#nib-sm"></use></svg></span>
<span style="width:42px;height:42px;display:inline-grid;place-items:center;background:var(--paper-900);border-radius:3px;--mink:#F3EDE1;--mseal:var(--seal-400)"><svg width="32" height="32"><use href="#nib-sm"></use></svg></span>
<span style="width:42px;height:42px;display:inline-grid;place-items:center;background:var(--seal-500);border-radius:3px;--mink:var(--paper-100);--mseal:var(--paper-100)"><svg width="32" height="32"><use href="#nib-sm"></use></svg></span>
<span style="font:400 10px var(--font-ui);color:var(--text-3)">bolder redraw — never scale down</span>
</span>
<span style="width:1px;height:44px;background:var(--hairline-strong)"></span>
<span data-theme="dark" style="display:inline-flex;gap:9px;align-items:center;background:var(--bg);padding:10px 14px;border-radius:6px;--mink:#F3EDE1;--mseal:var(--seal-400)"><svg width="26" height="26"><use href="#nib"></use></svg><span style="font:600 16px var(--font-display);color:var(--text)">Transcripta</span></span>
</div></body></html>
