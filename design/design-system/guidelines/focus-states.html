<!-- @dsCard group="Brand" viewport="700x150" name="Focus & States" subtitle="Derived, not invented: hover deepens, focus rings, active presses, disabled desaturates" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--bg);font-family:var(--font-ui)}.row{display:flex;gap:6px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.sw i{display:block;height:42px;border-radius:3px;border:1px solid var(--hairline)}.sw b{font:500 9.5px/1.2 var(--font-mono);color:var(--text)}.sw s{text-decoration:none;font:400 9px/1.25 var(--font-ui);color:var(--text-3);overflow:hidden;display:block}</style></head><body><div style="display:flex;gap:18px;align-items:center">
<div style="display:flex;flex-direction:column;gap:6px;align-items:center"><button class="tx-btn" style="background:var(--accent);color:var(--on-accent);">Confirm</button><span style="font:400 9.5px var(--font-ui);color:var(--text-3);text-align:center;max-width:90px">rest</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><button class="tx-btn" style="background:var(--accent-hover);color:var(--on-accent);">Confirm</button><span style="font:400 9.5px var(--font-ui);color:var(--text-3);text-align:center;max-width:90px">hover · deepens</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><button class="tx-btn" style="background:var(--accent);color:var(--on-accent);outline:2px solid var(--ring);outline-offset:1px">Confirm</button><span style="font:400 9.5px var(--font-ui);color:var(--text-3);text-align:center;max-width:90px">focus · 2px seal ring</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><button class="tx-btn" style="background:var(--accent-active);color:var(--on-accent);transform:translateY(1px)">Confirm</button><span style="font:400 9.5px var(--font-ui);color:var(--text-3);text-align:center;max-width:90px">active · presses in</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:center"><button class="tx-btn" style="background:var(--accent);color:var(--on-accent);opacity:.5;filter:saturate(.35)">Confirm</button><span style="font:400 9.5px var(--font-ui);color:var(--text-3);text-align:center;max-width:90px">disabled · toward paper</span></div>
</div>
<div style="margin-top:12px;font:400 11px var(--font-ui);color:var(--text-3)">The focus ring is never suppressed — keyboard-first means it must always be visible, both themes.</div></body></html>
