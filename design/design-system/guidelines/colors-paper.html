<!-- @dsCard group="Colors" viewport="700x130" name="Paper & Ink" subtitle="Warm neutral ramp — ivory to ink; never cool grey" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--bg);font-family:var(--font-ui)}.row{display:flex;gap:6px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.sw i{display:block;height:42px;border-radius:3px;border:1px solid var(--hairline)}.sw b{font:500 9.5px/1.2 var(--font-mono);color:var(--text)}.sw s{text-decoration:none;font:400 9px/1.25 var(--font-ui);color:var(--text-3);overflow:hidden;display:block}</style></head><body><div class="row"><div class="sw"><i style="background:var(--paper-100)"></i><b>paper-100</b><s>ivory · raised surfaces</s></div><div class="sw"><i style="background:var(--paper-200)"></i><b>paper-200</b><s>paper · page ground</s></div><div class="sw"><i style="background:var(--paper-300)"></i><b>paper-300</b><s>hover fills, headers</s></div><div class="sw"><i style="background:var(--paper-400)"></i><b>paper-400</b><s>hairline</s></div><div class="sw"><i style="background:var(--paper-500)"></i><b>paper-500</b><s>strong hairline</s></div><div class="sw"><i style="background:var(--paper-600)"></i><b>paper-600</b><s>faint glyphs</s></div><div class="sw"><i style="background:var(--paper-700)"></i><b>paper-700</b><s>tertiary text</s></div><div class="sw"><i style="background:var(--paper-800)"></i><b>paper-800</b><s>secondary text</s></div><div class="sw"><i style="background:var(--paper-900)"></i><b>paper-900</b><s>ink · primary text</s></div></div></body></html>
