<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--bg);font-family:var(--font-ui)}.row{display:flex;gap:6px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.sw i{display:block;height:42px;border-radius:3px;border:1px solid var(--hairline)}.sw b{font:500 9.5px/1.2 var(--font-mono);color:var(--text)}.sw s{text-decoration:none;font:400 9px/1.25 var(--font-ui);color:var(--text-3);overflow:hidden;display:block}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><div style="width:4px;height:4px;background:var(--seal-200);border:1px solid var(--seal-400);border-radius:2px"></div><span style="font:500 9.5px var(--font-mono);color:var(--text-3)">4</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><div style="width:8px;height:8px;background:var(--seal-200);border:1px solid var(--seal-400);border-radius:2px"></div><span style="font:500 9.5px var(--font-mono);color:var(--text-3)">8</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><div style="width:12px;height:12px;background:var(--seal-200);border:1px solid var(--seal-400);border-radius:2px"></div><span style="font:500 9.5px var(--font-mono);color:var(--text-3)">12</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><div style="width:16px;height:16px;background:var(--seal-200);border:1px solid var(--seal-400);border-radius:2px"></div><span style="font:500 9.5px var(--font-mono);color:var(--text-3)">16</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><div style="width:20px;height:20px;background:var(--seal-200);border:1px solid var(--seal-400);border-radius:2px"></div><span style="font:500 9.5px var(--font-mono);color:var(--text-3)">20</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><div style="width:24px;height:24px;background:var(--seal-200);border:1px solid var(--seal-400);border-radius:2px"></div><span style="font:500 9.5px var(--font-mono);color:var(--text-3)">24</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><div style="width:32px;height:32px;background:var(--seal-200);border:1px solid var(--seal-400);border-radius:2px"></div><span style="font:500 9.5px var(--font-mono);color:var(--text-3)">32</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><div style="width:40px;height:40px;background:var(--seal-200);border:1px solid var(--seal-400);border-radius:2px"></div><span style="font:500 9.5px var(--font-mono);color:var(--text-3)">40</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><div style="width:48px;height:48px;background:var(--seal-200);border:1px solid var(--seal-400);border-radius:2px"></div><span style="font:500 9.5px var(--font-mono);color:var(--text-3)">48</span></div><div style="display:flex;flex-direction:column;gap:4px;align-items:center"><div style="width:64px;height:64px;background:var(--seal-200);border:1px solid var(--seal-400);border-radius:2px"></div><span style="font:500 9.5px var(--font-mono);color:var(--text-3)">64</span></div></div></body></html>
