<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--bg);font-family:var(--font-ui)}.row{display:flex;gap:6px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.sw i{display:block;height:42px;border-radius:3px;border:1px solid var(--hairline)}.sw b{font:500 9.5px/1.2 var(--font-mono);color:var(--text)}.sw s{text-decoration:none;font:400 9px/1.25 var(--font-ui);color:var(--text-3);overflow:hidden;display:block}</style></head><body><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><button class="tx-btn tx-btn--sm tx-btn--secondary">28 dense</button><button class="tx-btn tx-btn--primary">32 default</button><button class="tx-btn tx-btn--lg tx-btn--secondary">36 prominent</button><input class="tx-input" style="width:180px" placeholder="32px input"><span style="font:400 10px var(--font-mono);color:var(--text-3)">work screens</span></div>
<div style="display:flex;gap:10px;align-items:center"><button class="tx-btn tx-btn--landing tx-btn--primary">Start transcribing</button><span style="font:400 10px var(--font-mono);color:var(--text-3)">landing only</span></div></body></html>
