<div style="font:600 15px/1.3 var(--font-display);color:var(--text);max-width:280px">State changes are instant cuts. Nothing slides, nothing fades.</div>
<div style="font:400 12px/1.55 var(--font-ui);color:var(--text-2);max-width:330px">200 ms × 300 pages is a minute of pure waiting. <span style="font-family:var(--font-mono);font-size:11px">transition: none</span> is the system default; the only motion allowed is the user’s own scrolling and dragging.</div>
