<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--bg);font-family:var(--font-ui)}.row{display:flex;gap:6px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.sw i{display:block;height:42px;border-radius:3px;border:1px solid var(--hairline)}.sw b{font:500 9.5px/1.2 var(--font-mono);color:var(--text)}.sw s{text-decoration:none;font:400 9px/1.25 var(--font-ui);color:var(--text-3);overflow:hidden;display:block}</style></head><body><div class="row"><div class="sw"><i style="background:var(--seal-100)"></i><b>seal-100</b><s>mark ground</s></div><div class="sw"><i style="background:var(--seal-200)"></i><b>seal-200</b><s>tint borders</s></div><div class="sw"><i style="background:var(--seal-300)"></i><b>seal-300</b><s>decorative</s></div><div class="sw"><i style="background:var(--seal-400)"></i><b>seal-400</b><s>mark underline</s></div><div class="sw"><i style="background:var(--seal-500)"></i><b>seal-500</b><s>#B23A2F · action fill, ring</s></div><div class="sw"><i style="background:var(--seal-600)"></i><b>seal-600</b><s>hover, links</s></div><div class="sw"><i style="background:var(--seal-700)"></i><b>seal-700</b><s>pressed, text on tint</s></div><div class="sw"><i style="background:var(--seal-800)"></i><b>seal-800</b><s>deep</s></div><div class="sw"><i style="background:var(--seal-900)"></i><b>seal-900</b><s>near-ink</s></div></div></body></html>
