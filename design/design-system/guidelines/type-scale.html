<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--bg);font-family:var(--font-ui)}.row{display:flex;gap:6px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.sw i{display:block;height:42px;border-radius:3px;border:1px solid var(--hairline)}.sw b{font:500 9.5px/1.2 var(--font-mono);color:var(--text)}.sw s{text-decoration:none;font:400 9px/1.25 var(--font-ui);color:var(--text-3);overflow:hidden;display:block}</style></head><body><div style="display:flex;flex-direction:column;gap:6px;color:var(--text)">
<div style="display:flex;gap:14px;align-items:baseline"><span style="font:500 10px var(--font-mono);color:var(--text-3);width:80px">2xl 26px</span><span style="font:600 26px/1.15 var(--font-display)">Page title — Fraunces</span></div>
<div style="display:flex;gap:14px;align-items:baseline"><span style="font:500 10px var(--font-mono);color:var(--text-3);width:80px">xl 20px</span><span style="font:600 20px/1.2 var(--font-display)">Section title</span></div>
<div style="display:flex;gap:14px;align-items:baseline"><span style="font:500 10px var(--font-mono);color:var(--text-3);width:80px">lg 16px</span><span style="font:400 16px/1.4 var(--font-ui)">Transcription reading text</span></div>
<div style="display:flex;gap:14px;align-items:baseline"><span style="font:500 10px var(--font-mono);color:var(--text-3);width:80px">md 14px</span><span style="font:400 14px/1.45 var(--font-ui)">Comfortable body</span></div>
<div style="display:flex;gap:14px;align-items:baseline"><span style="font:500 10px var(--font-mono);color:var(--text-3);width:80px">sm 13px</span><span style="font:400 13px/1.45 var(--font-ui)">Dense UI default — controls, table cells</span></div>
<div style="display:flex;gap:14px;align-items:baseline"><span style="font:500 10px var(--font-mono);color:var(--text-3);width:80px">xs 12px</span><span style="font:400 12px/1.4 var(--font-ui)">Captions, chips, kbd hints</span></div>
<div style="display:flex;gap:14px;align-items:baseline"><span style="font:500 10px var(--font-mono);color:var(--text-3);width:80px">2xs 11px</span><span style="font:600 11px var(--font-ui);letter-spacing:.07em;text-transform:uppercase;color:var(--text-2)">Table headers, legends</span></div>
