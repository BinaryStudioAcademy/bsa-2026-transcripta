<!-- @dsCard group="Colors" viewport="700x120" name="Action vs Failure" subtitle="Seal red means action; error red means failure — never the same color" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:14px;background:var(--bg);font-family:var(--font-ui)}.row{display:flex;gap:6px}.sw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.sw i{display:block;height:42px;border-radius:3px;border:1px solid var(--hairline)}.sw b{font:500 9.5px/1.2 var(--font-mono);color:var(--text)}.sw s{text-decoration:none;font:400 9px/1.25 var(--font-ui);color:var(--text-3);overflow:hidden;display:block}</style></head><body><div style="display:flex;gap:24px;align-items:center">
<span style="display:inline-flex;gap:8px;align-items:center"><button class="tx-btn tx-btn--primary">Confirm page</button><span style="font:400 11px var(--font-ui);color:var(--text-3)">action — seal 30°</span></span>
<span style="width:1px;height:40px;background:var(--hairline-strong)"></span>
<span style="display:inline-flex;gap:8px;align-items:center"><button class="tx-btn tx-btn--destructive">Delete document</button><span style="font:400 11px var(--font-ui);color:var(--text-3)">failure — carmine 13°</span></span>
<span style="width:1px;height:40px;background:var(--hairline-strong)"></span>
<span class="tx-chip tx-chip--danger">failed</span><span class="tx-chip tx-chip--seal">2 new words</span>
</div></body></html>
