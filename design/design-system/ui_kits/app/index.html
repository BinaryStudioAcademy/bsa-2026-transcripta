<!doctype html><html><head><meta charset="utf-8"><title>Transcripta — App</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body,#root{height:100%}body{margin:0}</style></head>
<body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="Documents.jsx"></script>
<script type="text/babel" src="Upload.jsx"></script>
<script type="text/babel" src="Auth.jsx"></script>
<script type="text/babel" src="Verification.jsx"></script>
<script type="text/babel">
function App(){
  const {Button}=window.TranscriptaDesignSystem_fa1864;
  const [screen,setScreen]=React.useState(localStorage.getItem('tx-kit-screen')||'documents');
  const [dark,setDark]=React.useState(false);
  const go=s=>{setScreen(s);try{localStorage.setItem('tx-kit-screen',s);}catch(e){}};
  const flip=()=>setDark(d=>!d);
  const themeBtn=<Button variant="ghost" size="sm" onClick={flip}>{dark?'Day':'Night'}</Button>;
  let view;
  if(screen==='auth')view=<TxAuth onIn={()=>go('documents')} themeBtn={themeBtn}/>;
  else if(screen==='verify')view=<TxVerify onBack={()=>go('documents')} themeBtn={themeBtn}/>;
  else view=<TxShell title={screen==='presets'?'Presets':screen==='upload'?'Upload':'Documents'} active={screen} onNav={go} unsaved={screen==='documents'?3:0} right={themeBtn}>
    {screen==='presets'?<TxPresets/>:screen==='upload'?<TxUpload onDone={()=>go('verify')}/>:<TxDocuments onOpen={()=>go('verify')} onUpload={()=>go('upload')}/>}
  </TxShell>;
  return <div data-theme={dark?'dark':undefined} style={{height:'100%',position:'relative',background:'var(--bg)'}}>{view}</div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
