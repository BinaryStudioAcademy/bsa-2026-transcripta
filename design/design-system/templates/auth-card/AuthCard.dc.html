<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Transcripta Centered-Card Shell" description="Auth: brand lockup over a raised ivory card on the paper ground" -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0}</style></helmet>
<div data-theme="{{ theme }}" style="min-height:100vh;background:var(--bg);display:grid;place-items:center;font-family:var(--font-ui);color:var(--text)">
<div style="width:360px;display:flex;flex-direction:column;gap:20px;padding:40px 0">
<div style="display:flex;gap:10px;align-items:center;justify-content:center">
<span style="width:30px;height:30px;border-radius:6px;background:var(--seal-500);display:inline-grid;place-items:center"><svg width="20" height="20" viewBox="0 0 48 48"><path d="M7 12 L41 8.5 L39.5 17 L8.5 19.5 Z" fill="var(--paper-100)"></path><path d="M19.5 15.5 L29 14.5 L26 42 L22.5 42 Z" fill="var(--paper-100)"></path><circle cx="33.5" cy="38.5" r="3.4" fill="var(--paper-100)"></circle></svg></span>
<span style="font:600 20px/1 var(--font-display)">Transcripta</span>
</div>
<div style="background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
<h1 style="font:600 20px/1.2 var(--font-display);margin:0">Sign in</h1>
<div><label class="tx-label" for="email">Email</label><input class="tx-input" id="email" type="email" placeholder="you@archive.org"></input></div>
<div><label class="tx-label" for="pw">Password</label><input class="tx-input" id="pw" type="password"></input></div>
<button class="tx-btn tx-btn--primary" style="width:100%;margin-top:4px">Sign in</button>
<div style="text-align:center;font:400 12px/1.4 var(--font-ui);color:var(--text-2)">New here? <a href="#">Create an account</a></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:720},&quot;darkTheme&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;}}">
class Component extends DCLogic {
  renderVals(){ return { theme: this.props.darkTheme ? 'dark' : null }; }
}
</script>
</body>
</html>
