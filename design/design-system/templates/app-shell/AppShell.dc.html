<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Transcripta App Shell" description="Sidebar + topbar shell for workspace, upload, and preset screens" -->
<helmet><script src="./ds-base.js"></script><style>body{margin:0}</style></helmet>
<div data-theme="{{ theme }}" style="display:flex;height:100vh;background:var(--bg);font-family:var(--font-ui);color:var(--text)">
<aside style="width:232px;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--hairline);padding:14px 12px;box-sizing:border-box;gap:4px">
<div style="display:flex;gap:9px;align-items:center;padding:4px 8px 14px">
<span style="width:26px;height:26px;border-radius:5px;background:var(--seal-500);display:inline-grid;place-items:center"><svg width="18" height="18" viewBox="0 0 48 48"><path d="M7 12 L41 8.5 L39.5 17 L8.5 19.5 Z" fill="var(--paper-100)"></path><path d="M19.5 15.5 L29 14.5 L26 42 L22.5 42 Z" fill="var(--paper-100)"></path><circle cx="33.5" cy="38.5" r="3.4" fill="var(--paper-100)"></circle></svg></span>
<span style="font:600 16px/1 var(--font-display)">Transcripta</span>
</div>
<a href="#" style="display:flex;align-items:center;height:32px;padding:0 10px;border-radius:var(--r-md);background:var(--surface-2);color:var(--text);font:500 13px/1 var(--font-ui);text-decoration:none">Documents</a>
<a href="#" style="display:flex;align-items:center;height:32px;padding:0 10px;border-radius:var(--r-md);color:var(--text-2);font:500 13px/1 var(--font-ui);text-decoration:none" style-hover="background:var(--surface-2);color:var(--text)">Presets</a>
<div style="flex:1"></div>
<div style="border-top:1px solid var(--hairline);padding:10px 8px 2px;display:flex;flex-direction:column;gap:6px">
<span style="font:400 12px/1.3 var(--font-ui);color:var(--text-2);overflow:hidden;text-overflow:ellipsis">reader@example.com</span>
<a href="#" style="font:500 12px/1 var(--font-ui);color:var(--text-3);text-decoration:none" style-hover="color:var(--accent-text)">Sign out</a>
</div>
</aside>
<div style="flex:1;display:flex;flex-direction:column;min-width:0">
<header style="height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--hairline)">
<h1 style="font:600 22px/1.15 var(--font-display);margin:0">{{ pageTitle }}</h1>
<div style="display:flex;gap:10px;align-items:center">
<span class="tx-chip"><span class="tnum" style="font-size:12px">3</span>unsaved actions</span>
<span class="tx-budget"><span class="tx-budget-bar"><i style="width:10%"></i></span>$0.98 / $10.00</span>
<button class="tx-btn tx-btn--ghost tx-btn--sm" onClick="{{ toggleTheme }}">{{ themeLabel }}</button>
</div>
</header>
<main style="flex:1;overflow:auto;padding:20px">
<div style="border:1px dashed var(--hairline-strong);border-radius:var(--r-lg);min-height:320px;display:grid;place-items:center;color:var(--text-3);font:400 13px/1 var(--font-ui)">Content area — compose your screen here</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;darkTheme&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;pageTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Documents&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;}}">
class Component extends DCLogic {
  state = { dark: null };
  renderVals(){
    const dark = this.state.dark ?? !!this.props.darkTheme;
    return {
      theme: dark ? 'dark' : null,
      themeLabel: dark ? 'Day' : 'Night',
      toggleTheme: () => this.setState({ dark: !dark }),
      pageTitle: this.props.pageTitle ?? 'Documents'
    };
  }
}
</script>
</body>
</html>
