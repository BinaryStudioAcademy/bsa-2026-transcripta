<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/transcripta-design-system-fa1864d6-1ebd-41ed-96b4-f72276642b99/tokens/fonts.css">
<link rel="stylesheet" href="_ds/transcripta-design-system-fa1864d6-1ebd-41ed-96b4-f72276642b99/tokens/colors.css">
<link rel="stylesheet" href="_ds/transcripta-design-system-fa1864d6-1ebd-41ed-96b4-f72276642b99/tokens/colors-dark.css">
<link rel="stylesheet" href="_ds/transcripta-design-system-fa1864d6-1ebd-41ed-96b4-f72276642b99/tokens/typography.css">
<link rel="stylesheet" href="_ds/transcripta-design-system-fa1864d6-1ebd-41ed-96b4-f72276642b99/tokens/spacing.css">
<link rel="stylesheet" href="_ds/transcripta-design-system-fa1864d6-1ebd-41ed-96b4-f72276642b99/css/base.css">
<link rel="stylesheet" href="_ds/transcripta-design-system-fa1864d6-1ebd-41ed-96b4-f72276642b99/css/components.css">
<link rel="stylesheet" href="_ds/transcripta-design-system-fa1864d6-1ebd-41ed-96b4-f72276642b99/styles.css">
<script src="_ds/transcripta-design-system-fa1864d6-1ebd-41ed-96b4-f72276642b99/_ds_bundle.js"></script>
<style>body{margin:0}</style>
</helmet>
<div data-theme="{{ theme }}" data-screen-label="Auth" style="min-height:100vh;background:var(--bg);display:grid;place-items:center;font-family:var(--font-ui);color:var(--text);position:relative;overflow:hidden">
<sc-if value="{{ isBrandB }}" hint-placeholder-val="{{ false }}">
<svg width="520" height="520" viewBox="0 0 48 48" style="position:absolute;left:50%;top:50%;transform:translate(-88%,-58%);opacity:0.05;pointer-events:none"><path d="M9 13 L39 9.5 L37.4 15.2 L10.6 17.4 Z" fill="var(--text)"></path><path d="M20.8 14.6 L27.6 13.9 L25.2 41.5 L23.4 41.5 Z" fill="var(--text)"></path><circle cx="30.5" cy="39.5" r="2.2" fill="var(--text)"></circle></svg>
</sc-if>
<div style="width:384px;display:flex;flex-direction:column;gap:28px;padding:56px 0;position:relative">
<sc-if value="{{ isBrandA }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;gap:10px;align-items:center;justify-content:center">
<span style="width:26px;height:26px;border-radius:5px;background:var(--seal-500);display:inline-grid;place-items:center"><svg width="18" height="18" viewBox="0 0 48 48"><path d="M7 12 L41 8.5 L39.5 17 L8.5 19.5 Z" fill="var(--paper-100)"></path><path d="M19.5 15.5 L29 14.5 L26 42 L22.5 42 Z" fill="var(--paper-100)"></path><circle cx="33.5" cy="38.5" r="3.4" fill="var(--paper-100)"></circle></svg></span>
<span style="font:600 20px/1 var(--font-display)">Transcripta</span>
</div>
</sc-if>
<div style="background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);padding:32px 28px 28px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box">
<sc-if value="{{ isBrandB }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;gap:8px;align-items:center">
<span style="width:20px;height:20px;border-radius:4px;background:var(--seal-500);display:inline-grid;place-items:center"><svg width="14" height="14" viewBox="0 0 48 48"><path d="M7 12 L41 8.5 L39.5 17 L8.5 19.5 Z" fill="var(--paper-100)"></path><path d="M19.5 15.5 L29 14.5 L26 42 L22.5 42 Z" fill="var(--paper-100)"></path><circle cx="33.5" cy="38.5" r="3.4" fill="var(--paper-100)"></circle></svg></span>
<span style="font:600 16px/1 var(--font-display)">Transcripta</span>
</div>
</sc-if>
<sc-if value="{{ isSignIn }}" hint-placeholder-val="{{ true }}">
<div data-screen-label="Sign in" style="display:flex;flex-direction:column;gap:18px">
<h1 style="font:600 24px/1.2 var(--font-display);margin:0">Sign in</h1>
<div><label class="tx-label" for="email">Email</label><input class="tx-input" id="email" type="email" value="{{ email }}" onChange="{{ setEmail }}" style="height:var(--ctl-lg)"></input></div>
<div>
<label class="tx-label" for="pw">Password</label>
<input class="tx-input" id="pw" type="password" style="height:var(--ctl-lg);border-color:{{ errBorder }}"></input>
<sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
<div style="margin-top:6px;font:400 var(--fs-sm)/1.4 var(--font-ui);color:var(--danger-text)">Wrong email or password.</div>
</sc-if>
</div>
<button class="tx-btn tx-btn--primary tx-btn--lg" style="width:100%">Sign in</button>
<div style="text-align:center;font:400 var(--fs-sm)/1.4 var(--font-ui);color:var(--text-2)">No account yet? <a href="#" onClick="{{ showSignUp }}">Create one</a></div>
</div>
</sc-if>
<sc-if value="{{ isSignUp }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="Sign up" style="display:flex;flex-direction:column;gap:18px">
<div style="display:flex;flex-direction:column;gap:8px">
<h1 style="font:600 24px/1.2 var(--font-display);margin:0">Create your account</h1>
<p style="margin:0;font:400 var(--fs-sm)/1.5 var(--font-ui);color:var(--text-2)">Turn scanned handwritten pages into verified text.</p>
</div>
<div>
<label class="tx-label" for="email2">Email</label>
<input class="tx-input" id="email2" type="email" placeholder="you@archive.org" style="height:var(--ctl-lg);border-color:{{ errBorder }}"></input>
<sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
<div style="margin-top:6px;font:400 var(--fs-sm)/1.4 var(--font-ui);color:var(--danger-text)">Enter a valid email address.</div>
</sc-if>
</div>
<div>
<label class="tx-label" for="pw2">Password</label>
<input class="tx-input" id="pw2" type="password" style="height:var(--ctl-lg)"></input>
<div style="margin-top:6px;font:400 var(--fs-xs)/1.4 var(--font-ui);color:var(--text-3)">At least 8 characters.</div>
</div>
<button class="tx-btn tx-btn--primary tx-btn--lg" style="width:100%">Create account</button>
<div style="text-align:center;font:400 var(--fs-sm)/1.4 var(--font-ui);color:var(--text-2)">Already have an account? <a href="#" onClick="{{ showSignIn }}">Sign in</a></div>
</div>
</sc-if>
</div>
<div style="text-align:center;font:400 var(--fs-xs)/1 var(--font-ui);color:var(--text-3)">Transcripta · BSA 2026</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;darkTheme&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Theme&quot;},&quot;brandMoment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;B · Watermark in the ground&quot;,&quot;options&quot;:[&quot;A · Lockup above the card&quot;,&quot;B · Watermark in the ground&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;},&quot;startOn&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Sign in&quot;,&quot;options&quot;:[&quot;Sign in&quot;,&quot;Sign up&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Screen&quot;},&quot;showError&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Screen&quot;}}">
class Component extends DCLogic {
  state = { mode: null, email: 'maria@archive.org' };
  renderVals() {
    const mode = this.state.mode ?? (this.props.startOn === 'Sign up' ? 'up' : 'in');
    const brandB = (this.props.brandMoment ?? 'A').startsWith('B');
    return {
      theme: this.props.darkTheme ? 'dark' : null,
      isSignIn: mode === 'in',
      isSignUp: mode === 'up',
      email: this.state.email,
      setEmail: (e) => this.setState({ email: e.target.value }),
      isBrandA: !brandB,
      isBrandB: brandB,
      showError: !!this.props.showError,
      errBorder: this.props.showError ? 'var(--danger)' : null,
      showSignUp: (e) => { e.preventDefault(); this.setState({ mode: 'up' }); },
      showSignIn: (e) => { e.preventDefault(); this.setState({ mode: 'in' }); }
    };
  }
}
</script>
</body>
</html>
