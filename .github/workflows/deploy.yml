name: deploy

on:
  push:
    branches: [main]

# OIDC: mint a short-lived token to assume the AWS role (no stored secrets).
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPO: 940521992973.dkr.ecr.us-east-1.amazonaws.com/transcripta-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          T=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$T" | cut -d. -f2 | base64 -d 2>/dev/null \
            | jq '{sub, repository, job_workflow_ref, aud, ref, workflow_ref}' || echo "decode failed"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::940521992973:role/transcripta-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The instance is Graviton (arm64); build for that even on an x86 runner.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REPO }}:latest
            ${{ env.ECR_REPO }}:${{ github.sha }}

      - name: Trigger redeploy on the instance (SSM)
        run: |
          aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name AWS-RunShellScript \
            --targets Key=tag:Project,Values=transcripta \
            --comment "deploy ${{ github.sha }}" \
            --parameters commands='/usr/local/bin/transcripta-deploy.sh'
